<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Расписание поездов</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <main class="page">
        <header class="page-header">
            <h1>🚂 Расписание поездов</h1>
            <p class="page-subtitle">Поиск расписания по станции и между двумя станциями.</p>
        </header>

        <section class="block">
            <h2>1. Загрузить страны</h2>
            <button id="loadCountriesBtn" type="button">Получить страны</button>

            <label for="country">Страна</label>
            <input id="country" list="countryOptions" placeholder="Начни вводить название страны">
            <datalist id="countryOptions"></datalist>
        </section>

        <section class="block">
            <h2>2. Загрузить станции выбранной страны</h2>
            <button id="loadStationsBtn" type="button">Получить станции</button>

            <label for="station1">Станция 1</label>
            <input id="station1" list="station1Options" placeholder="Начни вводить станцию отправления">
            <datalist id="station1Options"></datalist>

            <label for="station2">Станция 2</label>
            <input id="station2" list="station2Options" placeholder="Начни вводить станцию прибытия">
            <datalist id="station2Options"></datalist>
        </section>

        <section class="block">
            <h2>3. Расписание по одной станции</h2>
            <label for="singleDate">Дата</label>
            <input type="date" id="singleDate">

            <button id="loadSingleScheduleBtn" type="button">Получить расписание станции</button>
            <div id="singleResult" class="result-container">Здесь будет результат...</div>
        </section>

        <section class="block">
            <h2>4. Расписание между двумя станциями</h2>
            <label for="betweenDate">Дата</label>
            <input type="date" id="betweenDate">

            <button id="loadBetweenScheduleBtn" type="button">Получить расписание между станциями</button>
            <div id="betweenResult" class="result-container">Здесь будет результат...</div>
        </section>
    </main>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
